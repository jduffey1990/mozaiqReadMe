services:
  # ============================================
  # USERS DATABASE
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres-docker-local
    environment:
      POSTGRES_DB: wsapp
      POSTGRES_USER: wsapp
      POSTGRES_PASSWORD: wsapp
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsapp -d wsapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # COMPANIES DATABASE
  # ============================================
  postgres-companies:
    image: postgres:16-alpine
    container_name: postgres-companies-local
    environment:
      POSTGRES_DB: wsapp_companies
      POSTGRES_USER: wsapp
      POSTGRES_PASSWORD: wsapp
    ports: ["5433:5432"]  # Different host port to avoid conflict
    volumes:
      - pg_companies_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsapp -d wsapp_companies"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # USERS SERVICE
  # ============================================
  users:
    build:
      context: ./wsapp-users
    image: users-image
    container_name: services-users
    env_file:
      - ./wsapp-users/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://wsapp:wsapp@postgres:5432/wsapp
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports: ["3001:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./wsapp-users:/app
      - users_node_modules:/app/node_modules
    command: npm run dev

  # ============================================
  # COMPANIES SERVICE
  # ============================================
  companies:
    build:
      context: ./wsapp-companies
    image: companies-image
    container_name: services-companies
    env_file:
      - ./wsapp-companies/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://wsapp:wsapp@postgres-companies:5432/wsapp_companies
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports: ["3003:3000"]  # Different host port
    depends_on:
      postgres-companies:
        condition: service_healthy
    volumes:
      - ./wsapp-companies:/app
      - companies_node_modules:/app/node_modules
    command: npm run dev

  # ============================================
  # VERIFY SERVICE
  # ============================================
  brandora-verify:
    build:
      context: ./brandora-verify
    image: brandora-verify-image
    container_name: services-brandora-verify
    env_file:
      - ./brandora-verify/.env
    environment:
      NODE_ENV: development
      PORT: 3002
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports: ["3002:3002"]
    volumes:
      - ./brandora-verify:/app
      - verify_node_modules:/app/node_modules
    command: npm run dev

volumes:
  pg_data:
  pg_companies_data:
  users_node_modules:
  companies_node_modules:
  verify_node_modules: